name: self-test
on:
  push:
  workflow_dispatch:
jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Joonsense/tt-lowbit-dot-accelerator
          path: example
      - id: fit
        uses: ./
        with:
          project-dir: example
      - name: timing was checked (OpenSTA from the action is on PATH)
        run: |
          python3 tt_fit.py example --json | tee fit.json
          python3 -c "import json; d = json.load(open('fit.json')); assert d['pre_layout_ss_slack_ns'] is not None, d; assert d['tiles'] == '1x1', d"
